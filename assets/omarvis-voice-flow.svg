<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">A spoken request travels through a policy check and comes back as finished desktop work</title>
  <desc id="desc">You press a hotkey and speak; a realtime voice agent answers back, and only allowlisted commands reach your Omarchy desktop, Herdr agents, and browser.</desc>
  <rect width="1000" height="520" rx="20" fill="#f6f8fa"/>
  <rect x="28" y="28" width="944" height="464" rx="14" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <circle cx="56" cy="56" r="6" fill="#ff7b72"/><circle cx="76" cy="56" r="6" fill="#f2cc60"/><circle cx="96" cy="56" r="6" fill="#56d364"/>
  <rect x="126" y="45" width="430" height="22" rx="11" fill="#eef1f4"/>

  <!-- Card 1: you -->
  <rect x="60" y="104" width="248" height="330" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <rect x="76" y="120" width="216" height="36" rx="8" fill="#f6f8fa"/>
  <circle cx="94" cy="138" r="5" fill="#4ac26b"/>
  <text x="106" y="143" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#24292f">You · on a call</text>

  <rect x="108" y="172" width="184" height="48" rx="12" fill="#ddf4ff" stroke="#54aeff"/>
  <text x="200" y="192" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#0a3069">"Open my PR and</text>
  <text x="200" y="209" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#0a3069">bump the volume."</text>

  <rect x="76" y="232" width="184" height="48" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="168" y="252" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#24292f">"Done. PR's on</text>
  <text x="168" y="269" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#24292f">your screen."</text>

  <rect x="108" y="292" width="184" height="32" rx="12" fill="#ddf4ff" stroke="#54aeff"/>
  <text x="200" y="312" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#0a3069">"Perfect, thanks."</text>

  <circle cx="106" cy="368" r="17" fill="#ddf4ff" stroke="#54aeff" stroke-width="2"/>
  <g transform="translate(106,368)" fill="none">
    <rect x="-4" y="-9" width="8" height="12" rx="4" fill="#0969da"/>
    <path d="M-7 -1a7 7 0 0 0 14 0M0 6v4" stroke="#0969da" stroke-width="1.8" stroke-linecap="round"/>
  </g>
  <g stroke="#54aeff" stroke-width="3" stroke-linecap="round">
    <path d="M138 368v0"/><path d="M148 362v12"/><path d="M158 356v24"/><path d="M168 362v12"/><path d="M178 368v0"/>
    <path d="M188 360v16"/><path d="M198 366v4"/><path d="M208 358v20"/><path d="M218 364v8"/><path d="M228 368v0"/>
  </g>
  <text x="184" y="416" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#24292f">1. Press the hotkey, talk</text>

  <!-- Arrows 1 -> 2 -->
  <path d="M324 210h44" stroke="#8c959f" stroke-width="3" stroke-linecap="round"/><path d="m358 200 12 10-12 10" fill="none" stroke="#8c959f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="347" y="192" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">you speak</text>
  <path d="M368 330h-44" stroke="#8c959f" stroke-width="3" stroke-linecap="round"/><path d="m334 320-12 10 12 10" fill="none" stroke="#8c959f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="347" y="358" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">it answers</text>

  <!-- Card 2: agent -->
  <rect x="384" y="104" width="248" height="330" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <rect x="400" y="120" width="216" height="36" rx="8" fill="#f6f8fa"/>
  <text x="508" y="143" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#24292f">Realtime voice agent</text>

  <circle cx="508" cy="212" r="30" fill="#ddf4ff" stroke="#54aeff" stroke-width="2"/>
  <g transform="translate(508,212)" fill="none" stroke="#0969da" stroke-width="2.4" stroke-linecap="round">
    <path d="M-8 -4a8 8 0 0 1 16 0v4a8 8 0 0 1-16 0z" fill="#0969da" stroke="none"/>
    <path d="M-12 2a12 12 0 0 0 24 0M0 14v4"/>
  </g>
  <g stroke="#54aeff" stroke-width="2.4" stroke-linecap="round" fill="none">
    <path d="M464 204a14 14 0 0 1 0 16"/><path d="M456 198a22 22 0 0 1 0 28"/>
    <path d="M552 220a14 14 0 0 0 0-16"/><path d="M560 226a22 22 0 0 0 0-28"/>
  </g>
  <text x="508" y="270" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#57606a">Hears you, talks back,</text>
  <text x="508" y="289" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#57606a">acts through one tool</text>

  <rect x="404" y="314" width="208" height="56" rx="8" fill="#fff8c5" stroke="#d4a72c"/>
  <text x="508" y="337" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#7d4e00">Allowlisted commands only</text>
  <text x="508" y="356" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#7d4e00">Risky ones wait for your yes</text>

  <text x="508" y="416" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#24292f">2. Policy checks every command</text>

  <!-- Arrows 2 -> 3 -->
  <path d="M648 210h44" stroke="#8c959f" stroke-width="3" stroke-linecap="round"/><path d="m682 200 12 10-12 10" fill="none" stroke="#8c959f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="671" y="192" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">runs</text>
  <path d="M692 330h-44" stroke="#8c959f" stroke-width="3" stroke-linecap="round"/><path d="m658 320-12 10 12 10" fill="none" stroke="#8c959f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="671" y="358" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">live state</text>

  <!-- Card 3: desktop -->
  <rect x="708" y="104" width="248" height="330" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <rect x="724" y="120" width="216" height="36" rx="8" fill="#f6f8fa"/>
  <text x="832" y="143" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#24292f">Your Omarchy desktop</text>

  <rect x="724" y="172" width="216" height="98" rx="8" fill="#ffffff" stroke="#d8dee4"/>
  <text x="738" y="194" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#57606a">workspace 3</text>
  <circle cx="744" cy="216" r="5" fill="#4ac26b"/>
  <text x="758" y="221" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#24292f">browser · PR open</text>
  <circle cx="744" cy="246" r="5" fill="#0969da"/>
  <text x="758" y="251" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#24292f">volume · 30%</text>

  <rect x="724" y="282" width="216" height="70" rx="8" fill="#ffffff" stroke="#d8dee4"/>
  <text x="738" y="304" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#57606a">herdr</text>
  <circle cx="744" cy="328" r="5" fill="#4ac26b"/>
  <text x="758" y="333" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#24292f">api agent · prompted</text>

  <rect x="724" y="364" width="216" height="30" rx="8" fill="#dafbe1" stroke="#4ac26b"/>
  <text x="832" y="383" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#116329">omarchy · herdr · browser</text>

  <text x="832" y="416" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#24292f">3. The desktop does it</text>
</svg>
